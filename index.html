<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101b3d" />
  <meta name="description" content="Lumi & the Lost Stars — um jogo cozy de plataforma e exploração em uma floresta mágica." />
  <title>Lumi & the Lost Stars</title>
  <link rel="stylesheet" href="style.css?v=illustrated-3" />
  <link rel="preload" as="image" href="forest-art.png?v=illustrated-3" />
  <link rel="preload" as="image" href="lumi-spritesheet.png?v=illustrated-3" />
</head>
<body>
  <main class="game-shell">
    <header class="hud" aria-label="Game status">
      <div class="brand"><span class="brand-star">✦</span><span>Lumi <em>&amp; the Lost Stars</em></span></div>
      <div class="status-row">
        <span class="progress-label" id="progressText">✦ 0/20　✧ 0/3</span>
        <button class="icon-button" id="soundButton" type="button" aria-label="Alternar som" aria-pressed="false">♫</button>
        <button class="icon-button" id="contrastButton" type="button" aria-label="Alternar alto contraste" aria-pressed="false">◐</button>
      </div>
    </header>
    <section class="game-wrap" aria-label="Área jogável">
      <canvas id="game" width="1280" height="720" tabindex="0" aria-label="Jogo de plataforma da Lumi. Use as setas ou A e D para andar, Espaço para pular."></canvas>
      <div class="message" id="message" role="status" aria-live="polite"></div>
      <div class="touch-controls" aria-label="Controles de toque">
        <button data-key="left" aria-label="Mover para esquerda">◀</button><button data-key="jump" aria-label="Pular">✦</button><button data-key="right" aria-label="Mover para direita">▶</button>
      </div>
      <div class="help"><span>A/D ou ←/→ andar</span><span>Espaço pula</span><span>R volta ao checkpoint</span></div>
    </section>
    <footer><span>✦ exploração mágica · sem Game Over</span><span id="checkpointText">Checkpoint: início da floresta</span></footer>
  </main>
  <script src="game.js?v=illustrated-3"></script>
</body>
</html>
